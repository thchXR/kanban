<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanban</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="brand"><button id="iconBtn" class="board-icon" title="更换看板图标">◆</button><span>Kanban</span></div><div class="toolbar"><input id="search" class="search" placeholder="⌕ 搜索任务..."><button id="exportBtn" class="ghost">导出 JSON</button><button id="addBtn" class="primary">＋ 新建任务</button></div></header><main><section class="hero"><div><p class="eyebrow">PROJECT BOARD</p><h1 id="boardTitle">我的项目看板</h1><p class="sub">把复杂的工作拆成清晰、可执行的下一步。</p></div><div class="stats" id="stats"></div></section><section id="board" class="board"></section></main><dialog id="cardDialog"><form id="cardForm"><div class="dialog-head"><h2 id="dialogTitle">新建任务</h2><button type="button" id="closeDialog" class="close">×</button></div><label>任务标题<input id="title" required maxlength="120" placeholder="例如：实现登录页"></label><label>描述<textarea id="description" rows="3" placeholder="补充背景或验收标准"></textarea></label><div class="row"><label>负责人<input id="assignee" placeholder="姓名或 agent"></label><label>截止日期<input id="dueDate" type="date"></label></div><label>标签 <span class="hint">输入标签后可分别设置颜色</span><input id="labels" placeholder="输入标签后按回车，或用逗号分隔"><div class="palette-title">默认标签颜色</div><div id="colorPalette" class="color-palette"></div><div id="labelEditor" class="label-editor"></div></label><div class="sub-board-editor"><div class="sub-board-title">卡片内看板</div><div id="subBoardEditor" class="sub-board-editor-grid"></div><div class="sub-add-row"><input id="subTaskTitle" placeholder="添加子任务"><button type="button" id="addSubTask" class="ghost">添加</button></div></div><div class="dialog-actions"><button type="button" id="cancelDialog" class="ghost">取消</button><button id="saveCard" type="submit" class="primary">创建任务</button></div></form></dialog><dialog id="nestedBoardDialog"><div class="nested-dialog-head"><div><p class="eyebrow">CARD BOARD</p><h2 id="nestedBoardTitle">卡片内看板</h2></div><button type="button" id="closeNestedBoard" class="close">×</button></div><div id="nestedBoardView" class="nested-board-view"></div><div class="nested-dialog-actions"><input id="nestedTaskTitle" placeholder="添加子任务"><button type="button" id="addNestedTask" class="primary">＋ 添加任务</button><button type="button" id="saveNestedBoard" class="primary">保存看板</button></div></dialog><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
